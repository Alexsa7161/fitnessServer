  deploy:
    runs-on: ubuntu-latest
    # needs: sonar_scan
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up kubeconfig
        run: |
          echo "Step 1: Create .kube directory"
          mkdir -p $HOME/.kube
      
          echo "Step 2: Write kubeconfig YAML"
          cat > $HOME/.kube/config <<EOF
          apiVersion: v1
          kind: Config
          clusters:
          - name: my-cluster
            cluster:
              server: https://46.21.244.175
              certificate-authority-data: 
          users:
          - name: github-actions
            user:
              token: eyJhbGciOiJSUzI1NiIsImtpZCI6ImktX2JzcTNQeWFqRWtsUnNpamozY0IyTlZfX19hMGFFd1NrUkFkeFR0STQifQ..pM3fC_JpZe-hmMFxToDvKphZj2HxcVihKf4baGDZmkIP0T92A3DO1uIvB9kp3VXuGJlyW3VzwBEroCOtENbtkh-m6DQZHb7elJlXbyCuD_WNCcapYLCLxjSixm7TaIPAzxc2ETXyQ5_uamWOtxCP1DH7S8EAjHZYyBVMAbeaod1QAUsu5YCsHM1uISYyxV9vBEVgHzoW-_sG5G0V_nhBi1a5Cx3lchDoeYOWi-LJ0p2UO3t8oAAg0UIiSNw_cuLj4luByltxUECd5puhtTojpU-6c6o1CDW3vfOyS98QbV09Hg9auKIEYTEoP84jS6t719oWWLI_CDm2Uut89MCmIQ
          contexts:
          - name: github-actions
            context:
              cluster: my-cluster
              user: github-actions
              namespace: fitness-app
          current-context: github-actions
          EOF
      
          echo "Step 3: Verify kubeconfig"
          kubectl config get-contexts
          kubectl config current-context
          kubectl get nodes

          - name: Deploy to Kubernetes
            env:
              NAMESPACE: fitness-app  # обязательно!
            run: |
              echo "== Updating backend and frontend deployments =="
          
              kubectl -n $NAMESPACE set image deployment/fitness-backend fitness-backend=alexsa7161/fitness-server:latest
              kubectl -n $NAMESPACE set image deployment/fitness-frontend fitness-frontend=alexsa7161/fitness-client:latest
          
              echo "== Waiting for deployments to roll out =="
              kubectl -n $NAMESPACE rollout status deployment/fitness-backend
              kubectl -n $NAMESPACE rollout status deployment/fitness-frontend
          
              echo "== Restarting deployments to pull latest image =="
              kubectl -n $NAMESPACE rollout restart deployment/fitness-backend
              kubectl -n $NAMESPACE rollout restart deployment/fitness-frontend
          
              echo "== Current pods =="
              kubectl -n $NAMESPACE get pods

